# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-happy"
BBFILE_PATTERN_meta-happy = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-happy = "6"

LAYERDEPENDS_meta-happy = "core"
LAYERSERIES_COMPAT_meta-happy = "scarthgap"
